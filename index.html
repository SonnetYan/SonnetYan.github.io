<!doctype html>
<html lang="en">
<!--
  Mingxi Yan's homepage. One hand-written file: no framework, no tracker.
  Content lives in SITE at the top of the script; the layout only reads from it.
  Empty fields stay off the page. Add ?draft to the URL to see them as gray slots.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mingxi Yan</title>
<meta name="description" content="PhD candidate in Computer Science at Georgia State University. Simulation, data assimilation, and machine learning for complex dynamical systems. Tokyo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mingxi Yan">
<meta property="og:description" content="PhD candidate in Computer Science at Georgia State University. Simulation, data assimilation, and machine learning for complex dynamical systems. Tokyo.">
<meta property="og:url" content="https://sonnetyan.com/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..600&amp;display=swap">
<style>
  :root {
    --paper: #fbfbfa;
    --ink: #16171a;
    --ink-2: #484b51;
    --ink-3: #85888f;
    --rule: #e3e4e7;
    --wash: #efeff1;
    --serif: "Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121315;
      --ink: #e8e9eb;
      --ink-2: #b2b5bb;
      --ink-3: #7d8189;
      --rule: #2b2d32;
      --wash: #1c1d20;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121315;
    --ink: #e8e9eb;
    --ink-2: #b2b5bb;
    --ink-3: #7d8189;
    --rule: #2b2d32;
    --wash: #1c1d20;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.0625rem;
    line-height: 1.62;
    font-optical-sizing: auto;
    font-variant-numeric: oldstyle-nums;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }

  .page {
    max-width: 64rem;
    margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 44px);
    padding-block: clamp(20px, 4vw, 48px) 48px;
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.22em;
    text-decoration-color: var(--rule);
  }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible, button:focus-visible, h1:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  h1:focus:not(:focus-visible) { outline: none; }

  .links { display: flex; flex-wrap: wrap; gap: 0.3rem 1.4rem; }

  /* Top bar, shown on the detail views */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 2rem;
    padding-bottom: 1rem;
    margin-bottom: clamp(32px, 5vw, 56px);
    border-bottom: 1px solid var(--rule);
  }
  .top .home { font-size: 1.15rem; text-decoration: none; }

  /* Hero */
  .hero canvas { display: block; width: 100%; height: clamp(220px, 32vw, 380px); cursor: crosshair; touch-action: manipulation; }
  .id { display: grid; gap: 0.4rem; margin-top: clamp(12px, 2.5vw, 28px); }
  .id h1 { font-size: clamp(2.3rem, 5.4vw, 3.8rem); font-weight: 380; line-height: 1.04; letter-spacing: -0.015em; }
  .tagline {
    max-width: 32ch;
    font-size: clamp(1.15rem, 2.1vw, 1.5rem);
    font-style: italic;
    font-weight: 350;
    line-height: 1.35;
    color: var(--ink-2);
    text-wrap: balance;
  }
  .field { margin-top: 0.6rem; font-weight: 450; }
  .interests { color: var(--ink-2); }
  .id .links { margin-top: 0.7rem; }

  /* Home */
  .home-body { display: grid; gap: clamp(48px, 7vw, 88px); margin-top: clamp(44px, 6vw, 80px); }
  .about { display: grid; gap: 1rem; max-width: 38rem; font-size: 1.12rem; }
  .doors { display: grid; gap: clamp(40px, 5vw, 56px); }
  @media (min-width: 760px) { .doors { grid-template-columns: 1fr 1fr; } }
  .door, .now { display: grid; gap: 1rem; align-content: start; padding-top: 0.9rem; border-top: 1px solid var(--ink); }
  .door h2, .now h2 { font-size: 1.4rem; font-weight: 450; line-height: 1.2; }
  .door-body { display: grid; gap: 1.1rem; }
  .lead { color: var(--ink-2); }
  .door ul { display: grid; gap: 0.45rem; padding-left: 1.1rem; }
  .door li::marker { color: var(--ink-3); }
  .now { max-width: 38rem; }
  .now dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.3rem 1.1rem; }
  .now dt { font-style: italic; color: var(--ink-3); }
  .meta { font-size: 0.9rem; color: var(--ink-3); }

  /* Project tiles: the frame stays gray, the photos will bring the color */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 1.4rem 1rem; }
  .tiles.all { grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 2.2rem 1.5rem; }
  .tile { display: grid; gap: 0.35rem; align-content: start; }
  .ph {
    display: grid;
    place-items: center;
    aspect-ratio: 4 / 3;
    max-width: 100%;
    margin-bottom: 0.3rem;
    background: var(--wash);
    border: 1px solid var(--rule);
    color: var(--ink-3);
    font-size: 0.82rem;
    font-style: italic;
  }
  .tile h3 { font-size: 1rem; font-weight: 500; line-height: 1.35; }
  .tile p { font-size: 0.93rem; line-height: 1.5; color: var(--ink-2); }
  .tile .meta { color: var(--ink-3); }

  /* Detail views */
  .detail { display: grid; gap: clamp(40px, 6vw, 64px); }
  .detail > header { display: grid; gap: 0.8rem; max-width: 40rem; }
  .detail h1 { font-size: clamp(2rem, 4.4vw, 3rem); font-weight: 380; line-height: 1.08; letter-spacing: -0.01em; }
  .lede { font-size: 1.12rem; color: var(--ink-2); }
  .block { display: grid; gap: 1.1rem; max-width: 40rem; padding-top: 0.9rem; border-top: 1px solid var(--rule); }
  .block h2 { font-size: 1rem; font-weight: 400; font-style: italic; color: var(--ink-3); }
  .list { display: grid; gap: 1.4rem; padding: 0; list-style: none; }
  .list li { display: grid; gap: 0.15rem; }
  .list h3, .list .t { font-size: 1.0625rem; font-weight: 500; line-height: 1.4; text-wrap: balance; }
  .sub { color: var(--ink-2); }
  .sub b { font-weight: 600; color: var(--ink); }

  /* Footer */
  footer { display: grid; gap: 0.5rem; margin-top: clamp(64px, 9vw, 112px); padding-top: 1.1rem; border-top: 1px solid var(--rule); }
  .contact { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.9rem; }
  .contact .label { font-style: italic; color: var(--ink-3); }
  .addr { user-select: all; }
  button {
    padding: 0.05rem 0.65rem;
    font: inherit;
    font-size: 0.88rem;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ink-3); }
  .note { font-size: 0.88rem; color: var(--ink-3); }

  /* Real content: the headline keeps the width of the About text; long DOIs wrap on phones */
  .field { max-width: 38rem; }
  .doi a { overflow-wrap: anywhere; }
  img.ph { display: block; width: 100%; object-fit: cover; }

  /* Draft view (?draft): each empty field is a quiet gray slot that names what goes there */
  .slot {
    display: inline-block;
    padding: 0 0.5em;
    font-size: 0.85rem;
    font-style: italic;
    font-weight: 400;
    line-height: 1.6;
    color: var(--ink-3);
    background: var(--wash);
    border: 1px dashed var(--rule);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="page">
  <header class="top" id="topbar" hidden>
    <a class="home" href="#" data-name></a>
    <nav class="links" aria-label="Site" data-links></nav>
  </header>

  <main>
    <div class="view" id="home">
      <header class="hero">
        <canvas id="pf" role="img" aria-label="A particle filter at work: a soft cloud of dots follows a hidden, wandering path and tightens as noisy observations arrive. A click adds an observation of your own."></canvas>
        <div class="id">
          <h1 data-heading tabindex="-1"></h1>
          <p class="tagline" data-tagline></p>
          <p class="field" data-field></p>
          <p class="interests" data-interests></p>
          <nav class="links" aria-label="Site" data-links></nav>
        </div>
      </header>

      <div class="home-body">
        <div class="about" data-about></div>
        <div class="doors">
          <section class="door" aria-labelledby="door-research">
            <h2 id="door-research">Research</h2>
            <div class="door-body" data-door-research></div>
          </section>
          <section class="door" aria-labelledby="door-making">
            <h2 id="door-making">Making</h2>
            <div class="door-body" data-door-making></div>
          </section>
        </div>
        <section class="now" aria-labelledby="now-h">
          <h2 id="now-h">Now</h2>
          <div data-now></div>
        </section>
      </div>
    </div>

    <article class="view detail" id="research" aria-labelledby="research-h" hidden></article>
    <article class="view detail" id="making" aria-labelledby="making-h" hidden></article>
  </main>

  <footer id="contact">
    <p class="contact">
      <span class="label">Email</span>
      <span class="addr" data-email></span>
      <button type="button" id="copy-email">Copy</button>
    </p>
    <p class="note" data-updated></p>
  </footer>
</div>

<script>
/* ---------- Content: edit here. Everything below reads from SITE. ---------- */
/* An empty string or list is a field not filled yet: it stays off the page, and ?draft shows it as a gray slot. */
const SITE = {
  name: "Mingxi Yan",
  heading: "Mingxi (Sonnet) Yan",
  tagline: "Seeing what a system is really doing, from a few noisy observations.",
  field: "PhD candidate in Computer Science at Georgia State University. Simulation, data assimilation, and machine learning for complex dynamical systems. Tokyo.",
  interests: "Also: programming, 3D printing, and more.",
  links: [
    ["Research", "#research"],
    ["Making", "#making"],
    ["CV", "cv.pdf"],
    ["GitHub", "https://github.com/SonnetYan"],
    ["Scholar", ""],
    ["ORCID", ""],
    ["LinkedIn", ""],
    ["Email", "#contact"]
  ],
  about: [
    "I build systems that estimate what is really happening inside complex, partially observable processes, and say how confident they are. My PhD develops learned observation operators for particle-filter data assimilation, validated on real highway sensor data; earlier work built the web platform and services behind a live wildfire digital twin.",
    "Before the AI era, I was a full-stack engineer. I loved writing good code and getting the architecture right. Today I still build things end to end, but most of my attention goes to science and creative work."
  ],
  research: {
    line: "From modeling and simulation to state estimation, uncertainty, forecasting, and decision support.",
    highlights: [
      "Dissertation: learned observation operators for particle-filter data assimilation, validated on real Caltrans PeMS data.",
      "Online calibration of simulation models with particle filters (SIMULATION 2024, WSC 2024).",
      "FireSim, a wildfire digital twin that runs live on the web. Others keep developing on the framework I built."
    ],
    lede: "I build systems that estimate what is really happening inside complex, partially observable processes, and say how confident they are.",
    themes: [
      {
        title: "Learned observation operators",
        text: "My dissertation develops learned observation operators for particle-filter data assimilation. A neural network learns how the hidden state of traffic maps to sensor readings, in place of a hand-written formula. It is trained on real Caltrans PeMS highway sensor data and tested on another year and other sensors, and the same trained network also runs inside an ensemble Kalman filter. I wrote every part myself: data pipeline, simulation, training, inference, and evaluation. This work is not yet published."
      },
      {
        title: "Online calibration of simulation models",
        text: "A particle filter takes in observations as they arrive and estimates the system's state and the model's parameters together, so the model is calibrated while it runs. With several parameters, different combinations can fit the same observations, so the true values are hard to pin down; the WSC 2024 paper studies that case."
      },
      {
        title: "A live wildfire digital twin",
        text: "I built FireSim's front end and back end on my own, then the service and web layer of the lab's cloud wildfire simulation tools. Others keep developing on that framework. FireSim runs live at",
        link: ["firesim.cs.gsu.edu", "https://firesim.cs.gsu.edu/"]
      }
    ],
    papers: [
      {
        title: "Data assimilation for online model calibration in discrete event simulation",
        authors: "Xiaolin Hu, <b>Mingxi Yan</b>",
        venue: "SIMULATION", volume: "100(6)", pages: "529-544", year: "2024",
        doi: "10.1177/00375497231221578", pdf: "",
        contribution: ""
      },
      {
        title: "Data Assimilation for Online Calibration of Simulation Digital Twin - A Case Study With Multiple Model Parameters",
        authors: "Xiaolin Hu, <b>Mingxi Yan</b>",
        venue: "Winter Simulation Conference (WSC)", pages: "2844-2855", year: "2024",
        doi: "10.1109/WSC63780.2024.10838855", pdf: "https://informs-sim.org/wsc24papers/inv175.pdf",
        contribution: ""
      },
      {
        title: "WIP: Towards Cloud-based Wildland Fire Simulation Service",
        authors: "Xiaolin Hu, <b>Mingxi Yan</b>, Tony Derado, Wei Zhao, Bernard Zeigler, Doohwan Kim, Chungman Seo",
        venue: "IEEE International Conference on Service-Oriented System Engineering (SOSE)", pages: "20-24", year: "2024",
        doi: "10.1109/SOSE62363.2024.00009", pdf: "",
        contribution: ""
      },
      {
        title: "Towards A Map-Based Web Application for Prescribed Fire Simulation",
        authors: "<b>Mingxi Yan</b>, Xiaolin Hu",
        venue: "IEEE SoutheastCon", pages: "920-926", year: "2023",
        doi: "10.1109/SoutheastCon51012.2023.10115091", pdf: "",
        contribution: "Designed and built the web application, front end and back end."
      }
    ],
    talks: [],
    cv: { text: "Work history and dates are in the CV.", href: "cv.pdf" }
  },
  making: {
    line: "Small projects in code, 3D printing, and more.",
    lede: "Things I make in code, 3D printing, and more. Some are just for fun.",
    projects: []
  },
  now: {
    updated: "",
    items: [["Working on", ""], ["Learning", ""], ["Making", ""]]
  },
  email: "mingxi@sonnetyan.com",
  updated: "2026-10-04"
};

/* ---------- Layout: builds the page from SITE ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/* ?draft in the URL shows each empty field as a gray slot. Without it, empty fields and sections stay off the page. */
const DRAFT = new URLSearchParams(location.search).has("draft");
const filled = (value) => (Array.isArray(value) ? value.length > 0 : String(value ?? "").trim() !== "");

function put(node, ...kids) {  // append, skipping whatever was left out
  node.append(...kids.filter((kid) => kid != null && kid !== false && kid !== ""));
  return node;
}

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "text") node.textContent = value;
    else if (key === "html") node.innerHTML = value;
    else node.setAttribute(key, value);
  }
  return put(node, ...kids);
}

function slot(label) {
  return el("span", { class: "slot", text: label });
}

function textOrSlot(tag, attrs, value, label) {  // the value; if it is empty, a slot in draft view, else nothing
  if (filled(value)) return el(tag, { ...attrs, text: value });
  return DRAFT ? el(tag, attrs, slot(label)) : null;
}

function fill(node, value, label) {  // the same, for an element already in the markup
  if (filled(value)) node.textContent = value;
  else if (DRAFT) node.replaceChildren(slot(label));
  else node.remove();
}

function tile(p, full) {
  const photo = filled(p.photo) ? el("img", { class: "ph", src: p.photo, alt: p.name || "", loading: "lazy" })
    : DRAFT ? el("div", { class: "ph", text: p.kind ? `photo: ${p.kind}` : "photo" }) : null;
  return el("article", { class: "tile" },
    photo,
    textOrSlot("h3", {}, p.name, "project name"),
    textOrSlot("p", {}, p.text, "one line on what it is"),
    full && textOrSlot("p", { class: "meta" }, p.tools, "tools"));
}

function emptyTiles(count, full) {  // draft view before any project is in: empty tiles show the shape
  return Array.from({ length: count }, () => tile({}, full));
}

function theme(t) {
  return el("li", {},
    el("h3", { text: t.title }),
    el("p", { class: "sub" }, t.text, ...(t.link ? [" ", el("a", { href: t.link[1], text: t.link[0] }), "."] : [])));
}

function paper(p) {
  const where = [`<i>${p.venue}</i>${p.volume ? ` ${p.volume}` : ""}`, p.year, p.pages && `pp. ${p.pages}`].filter(Boolean).join(", ");
  const doi = filled(p.doi) ? `https://doi.org/${p.doi}` : "";
  return el("li", {},
    el("p", { class: "t", text: p.title }),
    el("p", { class: "sub", html: p.authors }),
    el("p", { class: "sub", html: where }),
    doi && el("p", { class: "sub doi" }, el("a", { href: doi, text: doi }),
      ...(filled(p.pdf) ? [", ", el("a", { href: p.pdf, text: "PDF" })] : [])),
    (filled(p.contribution) || DRAFT) && el("p", { class: "sub" }, el("i", { text: "My contribution:" }), " ",
      filled(p.contribution) ? p.contribution : slot("what I did in this paper")));
}

function talk([title, where, year]) {
  return el("li", {}, el("p", { text: title }), el("p", { class: "sub", html: `<i>${where}</i>, ${year}` }));
}

function block(id, title, ...kids) {
  return el("section", { class: "block", id, "aria-labelledby": `${id}-h` },
    el("h2", { id: `${id}-h`, text: title }), ...kids);
}

function render() {
  const r = SITE.research, m = SITE.making, now = SITE.now;
  const hasProjects = filled(m.projects), hasNow = now.items.some(([, value]) => filled(value));

  $("[data-name]").textContent = SITE.name;
  $("[data-heading]").textContent = SITE.heading;
  fill($("[data-tagline]"), SITE.tagline, "tagline");
  fill($("[data-field]"), SITE.field, "research field, one line");
  fill($("[data-interests]"), SITE.interests, "interests, one line");
  put($("[data-about]"), ...SITE.about.map((text) => textOrSlot("p", {}, text, "about, one paragraph")));

  put($("[data-door-research]"),
    textOrSlot("p", { class: "lead" }, r.line, "research, one line"),
    el("ul", {}, ...r.highlights.map((text) => el("li", { text }))),
    el("p", {}, el("a", { href: "#research", text: "Research and publications" })));

  if (hasProjects || DRAFT) {
    put($("[data-door-making]"),
      textOrSlot("p", { class: "lead" }, m.line, "making, one line"),
      el("div", { class: "tiles" }, ...(hasProjects ? m.projects.filter((p) => p.home).map((p) => tile(p, false)) : emptyTiles(4, false))),
      el("p", {}, el("a", { href: "#making", text: "All projects" })));
    put($("#making"),
      el("header", {},
        el("h1", { id: "making-h", tabindex: "-1", text: "Making" }),
        textOrSlot("p", { class: "lede" }, m.lede, "making, a sentence or two")),
      el("div", { class: "tiles all" }, ...(hasProjects ? m.projects.map((p) => tile(p, true)) : emptyTiles(6, true))));
  } else {
    $("[data-door-making]").closest(".door").remove();
    $("#making").remove();
  }

  if (hasNow || DRAFT) {
    put($("[data-now]"),
      el("dl", {}, ...now.items.filter(([, value]) => filled(value) || DRAFT)
        .flatMap(([key, value]) => [el("dt", { text: key }), el("dd", {}, filled(value) ? value : slot("one line"))])),
      textOrSlot("p", { class: "meta" }, filled(now.updated) ? `Updated ${now.updated}` : "", "month updated"));
  } else {
    $("[data-now]").closest(".now").remove();
  }

  put($("#research"),
    el("header", {},
      el("h1", { id: "research-h", tabindex: "-1", text: "Research" }),
      textOrSlot("p", { class: "lede" }, r.lede, "research, a sentence or two")),
    block("themes", "Themes", el("ul", { class: "list" }, ...r.themes.map(theme))),
    block("papers", "Publications", el("ol", { class: "list" }, ...r.papers.map(paper))),
    (filled(r.talks) || DRAFT) && block("talks", "Talks", el("ul", { class: "list" },
      ...(filled(r.talks) ? r.talks.map(talk) : [el("li", {}, slot("talk: title, event, year"))]))),
    (filled(r.cv.href) || DRAFT) && block("cv", "CV", el("p", {}, filled(r.cv.text) && `${r.cv.text} `,
      filled(r.cv.href) ? el("a", { href: r.cv.href, text: "CV (PDF)" }) : slot("CV (PDF)"))));

  // Links go in last: an in-page link shows only when its section made it onto the page.
  const link = ([text, href]) => {
    if (!filled(href)) return DRAFT ? slot(text) : null;
    if (href.startsWith("#") && !document.getElementById(href.slice(1))) return null;
    return el("a", { href, text });
  };
  $$("[data-links]").forEach((nav) => put(nav, ...SITE.links.map(link)));

  $("[data-email]").textContent = SITE.email;
  fill($("[data-updated]"), filled(SITE.updated) ? `Last updated ${SITE.updated}` : "", "last updated");
}

/* Views: #research and #making are detail views; any other anchor scrolls within its view. */
function route() {
  const views = $$(".view");
  const id = location.hash.slice(1);
  const target = id ? document.getElementById(id) : null;
  const shown = views.find((v) => !v.hidden) || views[0];
  const owner = target && (target.classList.contains("view") ? target : target.closest(".view"));
  const next = owner || (target ? shown : views[0]);
  views.forEach((v) => { v.hidden = v !== next; });
  $("#topbar").hidden = next.id === "home";
  if (target && target !== next) target.scrollIntoView();
  else window.scrollTo(0, 0);
  if (next !== shown) $("h1", next)?.focus({ preventScroll: true });
}

render();
route();
window.addEventListener("hashchange", route);

$("#copy-email").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  try {
    await navigator.clipboard.writeText(SITE.email);
    button.textContent = "Copied";
  } catch {
    const range = document.createRange();

    const box = canvas.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.width; H = box.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!started) {
      started = true;
      init(W / H, W < 600 ? 400 : 700);
      if (reduce) { while (!done) step(); ox.fill(0); oy.fill(0); }  // reduced motion: the end of act 1, still
    }
    draw();
    kick();
  }

  if ("ResizeObserver" in window) new ResizeObserver(resize).observe(canvas);
  else { window.addEventListener("resize", resize); resize(); }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; kick(); }).observe(canvas);
  }
  document.addEventListener("visibilitychange", kick);
  const retheme = () => { readColors(); draw(); };
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
</body>
</html>
